name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

env:
  AGENT_BASE_URL: "http://127.0.0.1:8123"

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -v --junitxml=report.xml
      - uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Backend Tests
          path: agent/report.xml
          reporter: java-junit

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run --reporter=junit --outputFile=report.xml
      - uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Frontend Tests
          path: web/report.xml
          reporter: java-junit

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: Start backend
        run: |
          uv sync --project agent
          uv run --project agent uvicorn app.main:app --host 0.0.0.0 --port 8123 > agent.log 2>&1 &
          sleep 8
          curl --retry 5 --retry-connrefused http://127.0.0.1:8123/health
      - name: Build frontend
        run: npm --prefix web ci && npm --prefix web run build
      - name: Install Playwright
        run: npx --prefix web playwright install chromium --with-deps
      - name: Start frontend
        run: |
          npm --prefix web run start > web.log 2>&1 &
          sleep 10
          curl --retry 5 --retry-connrefused http://localhost:3000
      - name: Run E2E tests
        run: npm --prefix web run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
            agent.log
            web.log
